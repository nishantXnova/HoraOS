name: release-apk

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android cmdline-tools + platform
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Make wrapper executable
        run: chmod +x WATCHOSS-aosp/launcher/gradlew

      - name: Build + test
        working-directory: WATCHOSS-aosp/launcher
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: WATCHOSS-aosp/launcher/app/build/outputs/apk/debug/*.apk
          body: |
            Sideload: download the APK, `adb install` it (or Wear Installer / Bugjaeger
            from your phone), then set WispOS as the Home app. Debug-signed — same key
            updates cleanly, but back up before switching to a future release key.
